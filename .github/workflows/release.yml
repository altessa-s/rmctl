name: Release

on:
  push:
    tags:
      - "v*"
  # Releases an existing tag with this workflow, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to release, such as v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The page and archive commands link rmlines-lib and rmdoc-lib, C23
  # libraries built through cgo, and rendering links rmrender-lib, so every
  # binary is built natively on its own runner; goreleaser only publishes
  # them and writes the changelog. A Linux archive carries libpdfium.so beside
  # the binary, which finds it through its $ORIGIN run path; Cairo and Pango
  # come from the system. The Windows archive is built by build-windows. The
  # macOS archives are built, signed and notarized on a Mac with
  # .github/scripts/release-macos.sh and added to the release afterwards.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # rmrender-lib's C23 needs clang 19; setup-render-linux.sh installs it.
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cc: clang-19 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cc: clang-19 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up the renderer's Linux build
        # The binary looks for libpdfium.so in its own directory.
        run: bash .github/scripts/setup-render-linux.sh '$ORIGIN'

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          pkg="github.com/altessa-s/go-atlas-core/runtime/appinfo"
          mkdir -p out artifacts
          go build -trimpath -o out/rmctl -ldflags "-s -w \
            -X ${pkg}.Name=rmctl -X ${pkg}.Project=rmctl -X ${pkg}.Version=${VERSION#v} \
            -X ${pkg}.Commit=$(git rev-parse --short=7 HEAD) -X ${pkg}.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/rmctl
          cp LICENSE README.md out/
          # The renderer's fonts are embedded in the binary, under the SIL Open Font License.
          mkdir -p out/licenses/fonts
          cp "$(go list -m -f '{{.Dir}}' github.com/altessa-s/rmrender-go)"/fonts/*-OFL.txt out/licenses/fonts/
          cp "$PDFIUM_DIR/lib/libpdfium.so" out/
          mkdir -p out/licenses/pdfium
          cp "$PDFIUM_DIR/LICENSE" "$PDFIUM_DIR"/licenses/* out/licenses/pdfium/

      - name: Smoke test
        run: |
          bin=./out/rmctl
          "$bin" version --full
          # shellcheck disable=SC2016 # $ORIGIN is literal
          readelf -d "$bin" | grep -E 'R(UN)?PATH' | grep -qF '[$ORIGIN]' || { echo "::error::no \$ORIGIN run path"; exit 1; }
          sample=internal/adapter/renderer/testdata/Notes.rmdoc
          "$bin" render "$sample" -o "$RUNNER_TEMP/smoke.pdf"
          "$bin" render "$sample" --page 1 -o "$RUNNER_TEMP/smoke.png"

      - name: Pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts
          tar -C out -czf "artifacts/rmctl_${VERSION#v}_${GOOS}_${GOARCH}.tar.gz" .

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 7

  # rmctl.exe is built with MSYS2 CLANG64's clang against its Cairo stack and
  # the PDFium SDK, as rmrender-go's Windows CI builds it. Those are DLLs, so
  # the binary cannot be static: the zip carries every DLL it loads (ntldd -R,
  # all from CLANG64 or PDFium; Windows' own stay out) beside rmctl.exe, where
  # Windows looks first, with their licences under licenses/. The smoke test
  # runs the unpacked zip with PATH reduced to the Windows directory.
  build-windows:
    name: Build (windows/amd64)
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: false
          # The Go that setup-go installed, after CLANG64's clang and
          # pkg-config. The same packages as CI's Windows job.
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-cairo
            mingw-w64-clang-x86_64-pango
            mingw-w64-clang-x86_64-fontconfig
            mingw-w64-clang-x86_64-harfbuzz
            mingw-w64-clang-x86_64-gdk-pixbuf2
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-ntldd

      - name: Set up the renderer's Windows build
        # Fetches PDFium (checksum-verified) and points cgo at clang and PDFium.
        run: bash .github/scripts/setup-render-windows.sh

      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          pkg="github.com/altessa-s/go-atlas-core/runtime/appinfo"
          mkdir -p out artifacts
          go build -trimpath -o out/rmctl.exe -ldflags "-s -w \
            -X ${pkg}.Name=rmctl -X ${pkg}.Project=rmctl -X ${pkg}.Version=${VERSION#v} \
            -X ${pkg}.Commit=$(git rev-parse --short=7 HEAD) -X ${pkg}.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/rmctl
          cp LICENSE README.md out/
          # The renderer's fonts are embedded in the binary, under the SIL Open Font License.
          mkdir -p out/licenses/fonts
          cp "$(cygpath -u "$(go list -m -f '{{.Dir}}' github.com/altessa-s/rmrender-go)")"/fonts/*-OFL.txt out/licenses/fonts/
          mkdir -p out/licenses/pdfium
          cp "$PDFIUM_DIR/LICENSE" "$PDFIUM_DIR"/licenses/* out/licenses/pdfium/
          # pdfium.dll and the Cairo stack's DLLs, with the MSYS2 packages' licences.
          bash .github/scripts/bundle-windows-dlls.sh out/rmctl.exe

      - name: Pack
        # A zip, which Explorer opens.
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          (cd out && 7z a -tzip "../artifacts/rmctl_${VERSION#v}_windows_amd64.zip" . >/dev/null)

      - name: Smoke test
        # From the zip alone: unpacked into an empty directory and run with
        # PATH reduced to the Windows directory, rmctl.exe finds only the
        # DLLs beside it and Windows' own.
        run: |
          app="$(cygpath -u "$RUNNER_TEMP")/smoke/app"
          mkdir -p "$app"
          7z x -o"$(cygpath -w "$app")" artifacts/rmctl_*_windows_amd64.zip >/dev/null
          bash .github/scripts/bundle-windows-dlls.sh --verify "$app/rmctl.exe"
          system=$(cygpath -u "${SYSTEMROOT:-C:/Windows}")
          sample=$(cygpath -w "$PWD/internal/adapter/renderer/testdata/Notes.rmdoc")
          cd "$app/.."
          PATH="$system/System32:$system" "$app/rmctl.exe" version --full
          PATH="$system/System32:$system" "$app/rmctl.exe" render "$sample" -o smoke.pdf
          PATH="$system/System32:$system" "$app/rmctl.exe" render "$sample" --page 1 -o smoke.png
          head -c 5 smoke.pdf | grep -q '%PDF-' || { echo "::error::smoke.pdf is not a PDF"; exit 1; }
          head -c 8 smoke.png | grep -q 'PNG' || { echo "::error::smoke.png is not a PNG"; exit 1; }

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmctl-windows-amd64
          path: artifacts/*
          retention-days: 7

  release:
    name: Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rmctl-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: (cd artifacts && sha256sum rmctl_* > checksums.txt && cat checksums.txt)

      - name: Keep the archives out of git status
        # goreleaser refuses a dirty tree; a released tag's own .gitignore may
        # predate this directory.
        run: echo "/artifacts/" >> .git/info/exclude

      - name: Run GoReleaser
        # builds are skipped in .goreleaser.yml: it publishes artifacts/ and
        # writes the release notes from the commits.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

  # The Windows package managers install the archive this release published.
  # Pre-releases leave them alone; a job whose token is not set says so and
  # does nothing, so a release never waits on them.
  scoop:
    name: Scoop manifest
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - name: Require the bucket token
        id: token
        run: |
          if [[ -z "$BUCKET_TOKEN" ]]; then
            echo "::warning::SCOOP_BUCKET_TOKEN is not set; the Scoop manifest is not updated"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Write the manifest
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir artifacts
          .github/scripts/scoop-manifest.sh "${TAG#v}" artifacts/checksums.txt > rmctl.json
          cat rmctl.json

      - name: Push it to the bucket
        if: steps.token.outputs.set == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${BUCKET_TOKEN}@github.com/altessa-s/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp rmctl.json bucket/bucket/rmctl.json
          cd bucket
          git add bucket/rmctl.json
          if git diff --cached --quiet; then
            echo "the manifest is already current"
            exit 0
          fi
          git -c user.name=DM -c user.email=dm@altessa-s.com commit -m "feat(rmctl): update to ${TAG#v}"
          git push origin HEAD

  # winget-releaser opens a pull request to microsoft/winget-pkgs from the
  # fork under altessa-s, with manifests based on the version already there;
  # the first version is submitted by hand (see .github/scripts/README.md).
  winget:
    name: winget manifest
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Require the winget token
        id: token
        run: |
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "::warning::WINGET_TOKEN is not set; no winget pull request is opened"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.token.outputs.set == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Altessa.rmctl
          installers-regex: '_windows_amd64\.zip$'
          release-tag: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
