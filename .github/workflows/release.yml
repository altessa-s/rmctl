name: Release

on:
  push:
    tags:
      - "v*"
  # Releases an existing tag with this workflow, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to release, such as v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The page and archive commands link rmlines-lib and rmdoc-lib, C23
  # libraries built through cgo, so every binary is built natively on its own runner;
  # goreleaser only publishes them and writes the changelog.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cc: gcc }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cc: gcc }
          - { runner: macos-latest, goos: darwin, goarch: arm64, cc: clang }
          # Apple's clang builds the other architecture with -arch.
          - { runner: macos-latest, goos: darwin, goarch: amd64, cc: "clang -arch x86_64" }
          # cgo on Windows links through a MinGW-w64 toolchain; MSYS2's
          # UCRT64 GCC is current enough for C23.
          - { runner: windows-latest, goos: windows, goarch: amd64, cc: gcc }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up MinGW-w64
        if: matrix.goos == 'windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW-w64 first on the path
        if: matrix.goos == 'windows'
        shell: bash
        env:
          MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          printf '%s\\ucrt64\\bin\n' "$MSYS2" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          ext=""; static=""
          # A Windows binary carries the MinGW runtime instead of needing its DLLs.
          [[ "$GOOS" == windows ]] && { ext=".exe"; static="-linkmode=external -extldflags=-static"; }
          pkg="github.com/altessa-s/go-atlas-core/runtime/appinfo"
          mkdir -p out artifacts
          go build -trimpath -o "out/rmctl${ext}" -ldflags "-s -w ${static} \
            -X ${pkg}.Name=rmctl -X ${pkg}.Version=${VERSION#v} \
            -X ${pkg}.Commit=$(git rev-parse --short=7 HEAD) -X ${pkg}.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/rmctl
          cp LICENSE README.md out/
          name="rmctl_${VERSION#v}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd out && 7z a -tzip "../artifacts/${name}.zip" . >/dev/null)
          else
            tar -C out -czf "artifacts/${name}.tar.gz" .
          fi

      - name: Smoke test
        # darwin/amd64 is built on an arm64 runner and is not run here.
        if: matrix.goos != 'darwin' || matrix.goarch != 'amd64'
        shell: bash
        run: |
          bin=./out/rmctl
          if [[ "${{ matrix.goos }}" == windows ]]; then
            bin=./out/rmctl.exe
            # Only system DLLs: nothing from the MinGW toolchain.
            if objdump -p "$bin" | grep -iE 'DLL Name: (libgcc|libwinpthread|libstdc)'; then
              echo "::error::rmctl.exe depends on MinGW runtime DLLs"
              exit 1
            fi
          fi
          "$bin" version --full

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rmctl-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: (cd artifacts && sha256sum rmctl_* > checksums.txt && cat checksums.txt)

      - name: Run GoReleaser
        # builds are skipped in .goreleaser.yml: it publishes artifacts/ and
        # writes the release notes from the commits.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

  # The formula in altessa-s/homebrew-tap installs the archives this release
  # published. GITHUB_TOKEN cannot push to another repository, so the job
  # needs HOMEBREW_TAP_TOKEN (contents: write on the tap) and is skipped
  # without it; pre-releases leave the formula alone.
  homebrew:
    name: Homebrew formula
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checkout
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the archives
        if: env.TAP_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rmctl-*
          path: artifacts
          merge-multiple: true

      - name: Write the formula
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          (cd artifacts && sha256sum rmctl_* > checksums.txt)
          .github/scripts/homebrew-formula.sh "${VERSION#v}" artifacts/checksums.txt > rmctl.rb
          cat rmctl.rb

      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/altessa-s/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rmctl.rb tap/Formula/rmctl.rb
          cd tap
          git add Formula/rmctl.rb
          if git diff --cached --quiet; then
            echo "the formula is already current"
            exit 0
          fi
          git -c user.name=DM -c user.email=dm@altessa-s.com commit -m "feat(rmctl): update to ${VERSION#v}"
          git push origin HEAD
