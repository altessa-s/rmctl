name: Benchmarks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch is checked out into a worktree for comparison.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Restore the PDFium SDK
        # setup-render-*.sh keeps the SDK here under its checksum and fetches
        # it only on a miss, so a failing release download fails fewer runs.
        id: pdfium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdfium-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: pdfium-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        env:
          PDFIUM_CACHE: ${{ runner.temp }}/pdfium-cache
        run: bash .github/scripts/setup-render-linux.sh

      - name: Save the PDFium SDK
        # Right after the fetch, so a run whose tests fail still keeps it.
        if: steps.pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdfium-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

      - name: Compare benchmarks against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          # Shared runners are noisy: only a significant increase above
          # BENCH_THRESHOLD fails. The script's header documents its defaults.
          BENCH_REPORT: benchstat.txt
        run: bash .github/scripts/bench-regression.sh "origin/${BASE_REF}"

      - name: Upload benchstat report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchstat
          path: benchstat.txt
          if-no-files-found: ignore
          retention-days: 14
