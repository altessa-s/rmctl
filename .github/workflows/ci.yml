name: CI

on:
  workflow_call:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        run: bash .github/scripts/setup-render-linux.sh

      - name: Run golangci-lint
        # make golangci builds the linter from devtools/go.mod (its module
        # graph pins a golang.org/x/tools that reads Go 1.27 export data; the
        # golangci-lint-action goinstall mode fails typecheck) and runs it in
        # each directory of the Makefile's MODULES.
        run: make golangci

      - name: Run go vet and check go fix modernizers
        # go fix -diff exits non-zero when any modernizer would rewrite code.
        # clang 19 compiles the C23 libraries through cgo.
        run: make vet

      - name: Build without cgo
        # Where no C23 compiler is found rmctl builds without its page
        # commands and without rendering; this keeps that build compiling.
        run: make build-nocgo

      - name: Check duplicate code
        run: make dupl-check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        run: bash .github/scripts/setup-render-linux.sh

      - name: Run tests
        # Runs each directory of the Makefile's MODULES and merges the
        # profiles into coverage.out.
        run: make coverage

      - name: Enforce coverage floor
        env:
          COVERAGE_MIN: "93"
        run: |
          COVERAGE=$(make --no-print-directory coverage-total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}% (minimum ${COVERAGE_MIN}%)"
          awk -v actual="$COVERAGE" -v minimum="$COVERAGE_MIN" 'BEGIN { exit !(actual ~ /^[0-9]+([.][0-9]+)?$/ && actual + 0 >= minimum) }'

      - name: Enforce per-package coverage
        # The protocol packages and their threshold are listed in .coverage.yml.
        run: bash .github/scripts/coverage-gate.sh coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        run: bash .github/scripts/setup-render-linux.sh

      - name: Run integration tests
        run: make test-integration

  macos:
    name: Test (macOS, cgo)
    # The Keychain binding and the page and archive libraries build with
    # Apple's clang here. The Keychain integration tests stay skipped: a
    # runner's login Keychain may be locked.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # linux is covered by the main build; guard the platform-gated
        # code (*_darwin.go / *_other.go, the renderer's stub) against
        # build-tag rot on the other supported targets. Cross-compiling
        # turns cgo off.
        goos: [darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
        run: make build

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        run: bash .github/scripts/setup-render-linux.sh

      - name: Run govulncheck
        run: make govulncheck

      - name: Run gosec
        run: make gosec

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full commit history, not just the checkout.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run gitleaks (full history)
        run: gitleaks detect --redact --source . --config .gitleaks.toml
