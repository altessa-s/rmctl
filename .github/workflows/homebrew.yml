name: Homebrew

# Writes the formulas in altessa-s/homebrew-tap for a published release once
# it holds the archives of every platform they install, rmctl.rb from
# rmctl's and rmctl-lite.rb from rmctl-lite's: the Linux ones the release
# workflow builds, and the macOS ones
# .github/scripts/release-macos.sh adds from a Mac, which then starts this
# workflow. GITHUB_TOKEN cannot push to another repository, so the job needs
# HOMEBREW_TAP_TOKEN (contents: write on the tap); pre-releases leave the
# formulas alone.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The released tag, such as v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew formula
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require the tap token
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Download the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'rmctl_*_darwin_*.zip' --pattern 'rmctl_*_linux_*.tar.gz' \
            --pattern 'rmctl-lite_*_darwin_*.zip' --pattern 'rmctl-lite_*_linux_*.tar.gz'

      - name: Write the formulas
        # homebrew-formula.sh fails when an archive is missing.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          (cd artifacts && sha256sum rmctl_* rmctl-lite_* > checksums.txt && cat checksums.txt)
          .github/scripts/homebrew-formula.sh "${TAG#v}" artifacts/checksums.txt > rmctl.rb
          .github/scripts/homebrew-formula.sh --lite "${TAG#v}" artifacts/checksums.txt > rmctl-lite.rb
          cat rmctl.rb rmctl-lite.rb

      - name: Push them to the tap
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/altessa-s/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rmctl.rb rmctl-lite.rb tap/Formula/
          cd tap
          git add Formula/rmctl.rb Formula/rmctl-lite.rb
          if git diff --cached --quiet; then
            echo "the formulas are already current"
            exit 0
          fi
          git -c user.name=DM -c user.email=dm@altessa-s.com commit -m "feat(rmctl): update to ${TAG#v}"
          git push origin HEAD
