name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore the PDFium SDK
        # setup-render-*.sh keeps the SDK here under its checksum and fetches
        # it only on a miss, so a failing release download fails fewer runs.
        id: pdfium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdfium-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: pdfium-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up the renderer's Linux build
        # rmrender-go draws with Cairo, Pango and PDFium here and is C23 that
        # needs clang 19: the script installs them and points cgo at them.
        env:
          PDFIUM_CACHE: ${{ runner.temp }}/pdfium-cache
        run: bash .github/scripts/setup-render-linux.sh

      - name: Save the PDFium SDK
        # Right after the fetch, so a run whose tests fail still keeps it.
        if: steps.pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdfium-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
