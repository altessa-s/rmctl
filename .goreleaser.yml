# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# The binaries link C libraries through cgo and are built natively by the
# build matrix of .github/workflows/release.yml; goreleaser publishes them.
builds:
  - skip: true

checksum:
  disable: true

changelog:
  sort: asc
  use: github
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]/-]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]/-]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]/-]+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]/-]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]/-]+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^(ci|chore|test)(\([^)]*\))?!?:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: altessa-s
    name: rmctl
  prerelease: auto
  extra_files:
    - glob: ./artifacts/rmctl_*
    - glob: ./artifacts/checksums.txt
  name_template: "{{.Tag}}"
